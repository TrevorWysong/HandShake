<!doctype html>
<!--
  The key window's page (desktop/paymentKeys.ts): markup and styles only.
  No script runs here -- the policy below forbids it -- and nothing loads:
  its preload (desktop/paymentKeysPreload.ts) fills in the words and fields.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'" />
    <title>HandShake</title>
    <style>
      :root {
        --brand: #ff5a2b;
        --brand-strong: #f0431a;
        --ground: #fbf8f4;
        --surface: #ffffff;
        --rule: #d8d3cc;
        --muted: #6b6255;
        --ink: #1c1916;
        --focus: rgba(255, 90, 43, 0.25);
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1c1916;
          --surface: #26221e;
          --rule: #3f3931;
          --muted: #a79d93;
          --ink: #f4efe9;
          --focus: rgba(255, 122, 71, 0.35);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ground); color: var(--ink); }
      main { padding: 26px 28px 24px; }
      h1 { margin: 0 0 6px; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
      .intro { margin: 0 0 18px; font-size: 13px; line-height: 1.55; color: var(--muted); }
      form, .fields { display: flex; flex-direction: column; gap: 14px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      label { font-size: 12px; font-weight: 600; color: var(--muted); }
      .entry { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 0 6px 0 12px; }
      .entry:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus); }
      input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 11px 0; outline: none; }
      .reveal { border: 0; background: none; color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 600; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
      .reveal:hover { color: var(--ink); }
      .stays { margin: 4px 0 0; font-size: 11px; line-height: 1.5; color: var(--muted); }
      .actions { display: flex; gap: 10px; margin-top: 8px; }
      .actions button { flex: 1; border-radius: 999px; padding: 11px 16px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
      .cancel { border: 1px solid var(--rule); background: transparent; color: var(--ink); }
      .connect { border: 0; background: var(--brand); color: #fff; }
      .connect:hover:not(:disabled) { background: var(--brand-strong); }
      button:disabled { opacity: 0.5; cursor: default; }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p class="intro" id="intro"></p>
      <form id="keys" autocomplete="off" novalidate>
        <div class="fields" id="fields"></div>
        <p class="stays" id="stays"></p>
        <div class="actions">
          <button type="button" class="cancel" id="cancel"></button>
          <button type="submit" class="connect" id="connect" disabled></button>
        </div>
      </form>
    </main>
  </body>
</html>
