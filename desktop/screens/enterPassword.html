<!DOCTYPE html>
<!-- Every start once a password protects this device: unlock with it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only its own files run or load: no inline script, nothing from the network. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>HandShake</title>
    <link rel="stylesheet" href="screens.css" />
  </head>
  <body>
    <aside class="brand">
      <div>
        <img class="brand-mark" src="img/handshake.svg" alt="" />
        <div class="brand-name" data-product-name>HandShake</div>
        <div class="brand-version" data-version></div>
      </div>
      <p class="brand-tagline">Food from the places around you, straight from them, with no company in the middle.</p>
      <div class="brand-foot">Runs on your own device, on Holochain.<br />Licensed under the Cryptographic Autonomy License.</div>
    </aside>

    <main>
      <button class="close" id="close" type="button" aria-label="Close">×</button>

      <section class="step" id="unlock">
        <h1>Welcome back</h1>
        <p class="lede">Enter your password to unlock HandShake on this device.</p>
        <div class="field">
          <label for="password-input">Password</label>
          <input id="password-input" type="password" autocomplete="current-password" />
          <button class="reveal" type="button" data-reveals="password-input" aria-pressed="false">Show</button>
        </div>
        <p class="error" id="error" role="alert"></p>
        <button class="button" id="unlock-button" type="button" disabled>Unlock</button>
      </section>

      <section class="step progress" id="starting" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="progress-message" id="progress-message" role="status">Starting…</p>
      </section>
    </main>

    <script type="module">
      import { closeButton, followProgress, launch, revealToggles, showNameAndVersion, showStep } from "./screens.js";

      showNameAndVersion();
      closeButton();
      followProgress();
      revealToggles();

      const input = document.getElementById("password-input");
      const button = document.getElementById("unlock-button");
      const error = document.getElementById("error");
      input.focus();

      input.addEventListener("input", () => {
        button.disabled = !input.value;
        error.textContent = "";
      });

      async function unlock() {
        if (!input.value) return;
        try {
          await launch({ type: "user-provided", password: input.value });
        } catch (e) {
          console.error("Failed to launch: ", e);
          showStep("unlock");
          // Kangaroo's own word for it (src/main): told apart from a failed start.
          if (String(e).includes("Wrong password.")) {
            input.value = "";
            button.disabled = true;
            error.textContent = "That password isn't right.";
          } else {
            error.textContent = "HandShake couldn't start. Try again.";
          }
          input.focus();
        }
      }
      button.addEventListener("click", unlock);
      input.addEventListener("keydown", (e) => e.key === "Enter" && unlock());
    </script>
  </body>
</html>
