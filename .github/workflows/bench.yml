name: Bench

# How validation's cost grows with a chain's length (tests/tryorama/bench).
# Run by hand -- Actions → Bench → Run workflow -- on a clean runner, where
# timings mean something.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Chain lengths to measure at (actions since the recovery plan)
        default: "0 1000 2000 4000"

# Read-only: it measures, and never writes to the repo.
permissions:
  contents: read

jobs:
  chain-cost:
    name: Chain cost
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/holochain-bins
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/tryorama/package-lock.json
      - name: Build and pack the hApp
        run: |
          cargo build --release --target wasm32-unknown-unknown
          hc dna pack dnas/handshake/workdir
          hc app pack workdir
      - name: Measure
        working-directory: tests/tryorama
        run: |
          npm ci
          npm run build:test-coordinators
          npx tsx bench/chain-cost.ts ${{ inputs.sizes }} 2>&1 | grep -vE "Tryorama\] \[3[123]m" | tee bench.log
          grep -E "^\s+[0-9]+ +\||chain actions" bench.log >> "$GITHUB_STEP_SUMMARY"
