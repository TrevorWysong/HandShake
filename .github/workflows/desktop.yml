name: Desktop

# Builds HandShake's desktop installers (desktop/, Kangaroo) for macOS, Windows
# and Linux into a draft GitHub release, v<version> from
# desktop/kangaroo.config.ts. Publish the draft by hand once it looks right;
# installed apps update themselves from published releases.
#
# Run it from the Actions tab ("Run workflow"). Bump the version first: a
# release's assets are replaced, not versioned, if the draft already exists.

on:
  workflow_dispatch:

concurrency:
  group: desktop
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle and draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: version
        run: |
          echo "version=$(sed -nE "s/^  version: '([^']+)',$/\1/p" desktop/kangaroo.config.ts)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/holochain-bins
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Package the network's bundle
        working-directory: web
        run: |
          npm ci
          npm run package -- --network ../desktop/network.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webhapp
          path: deploy/handshake.webhapp
          if-no-files-found: error
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "HandShake $VERSION" \
              --notes "Desktop installers for macOS (Apple Silicon and Intel), Windows and Linux. Unsigned for now: see desktop/README.md for opening them."
          fi
          # Only a draft is ever written to: a release its owner has published
          # is what installed apps update from, and is never replaced. Bump
          # the version for a new one.
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft)" != "true" ]; then
            echo "v$VERSION is already published; bump desktop/kangaroo.config.ts's version for a new release." >&2
            exit 1
          fi
          # A draft already there is built again from this commit, and is
          # tagged at it when published: never at the one that first drafted it.
          gh release edit "v$VERSION" --target "$GITHUB_SHA"

  installers:
    name: Installer (${{ matrix.target }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, runs-on: macos-latest }
          - { target: mac-x64, runs-on: macos-15-intel }
          - { target: win, runs-on: windows-2022 }
          - { target: linux, runs-on: ubuntu-22.04 }
    runs-on: ${{ matrix.runs-on }}
    # The signing certificates live in this environment, not the repo: only
    # a run from main reaches them, and only once its owner approves it.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bundle.outputs.version }}
      APP_ID: io.github.trevorwysong.handshake
      # Unsigned until the signing secrets exist (desktop/README.md).
      CSC_IDENTITY_AUTO_DISCOVERY: false
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webhapp
          path: deploy
      - name: Build and upload
        run: node desktop/build.ts ${{ matrix.target }}
        # Signing certificates, when the repo has them as secrets. A build
        # without them installs but doesn't update itself
        # (desktop/kangaroo.config.ts): an unsigned update could be anyone's.
        env:
          CSC_LINK: ${{ startsWith(matrix.target, 'mac') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.target, 'mac') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # The packaged app, attacked as someone on the same machine would
      # (desktop/securityCheck.ts): its fuses, no code run from outside, and
      # the payment-key window's isolation. A failure fails the job, and the
      # draft isn't to be published until it passes. Linux has no display:
      # a virtual one.
      - name: Security check the packaged app
        run: ${{ matrix.target == 'linux' && 'xvfb-run -a ' || '' }}node desktop/securityCheck.ts
      - name: Linux package fix-ups
        if: matrix.target == 'linux'
        working-directory: desktop/.kangaroo
        run: |
          node ./scripts/extend-deb-postinst.mjs
          gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" latest-linux.yml "dist/${APP_ID}_${VERSION}_amd64.deb" --clobber
      - name: One macOS update manifest for both architectures
        if: startsWith(matrix.target, 'mac-')
        working-directory: desktop/.kangaroo
        run: node ./scripts/merge-mac-yamls.mjs
