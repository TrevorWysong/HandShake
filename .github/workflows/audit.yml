name: Dependency audit

# Known vulnerabilities in what ships: the app's, the payment agent's and
# the push relay's production npm packages, and the Rust crates the zomes
# and runtime build from. Weekly, whenever a lockfile changes, and by hand.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**/package-lock.json"
      - "Cargo.lock"
  workflow_dispatch:

# Read-only: it reports, and never writes to the repo.
permissions:
  contents: read

jobs:
  npm:
    name: npm packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [web, payments, push]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.package }}

  cargo:
    name: Rust crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
