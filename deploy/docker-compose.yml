# A HandShake network's servers: its bootstrap/relay server and -- with
# `--profile push` -- a push relay, behind Caddy for TLS. See
# docs/DEPLOYMENT.md, "Run the servers". Point the domains' DNS at this
# machine. There's no money server: stores and drivers are paid on their own
# processor accounts (docs/DIRECT_PAYMENTS.md).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      BOOTSTRAP_DOMAIN: ${BOOTSTRAP_DOMAIN:?set BOOTSTRAP_DOMAIN}
      PUSH_DOMAIN: ${PUSH_DOMAIN:-push.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  bootstrap:
    build: { context: .., dockerfile: deploy/bootstrap/Dockerfile }
    restart: unless-stopped

  push:
    profiles: [push]
    build: { context: .., dockerfile: deploy/push/Dockerfile }
    restart: unless-stopped
    env_file: ./push.env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - push-data:/var/lib/handshake-push

volumes:
  caddy-data:
  push-data:
